name: arta
description: Pencatatan keuangan pribadi offline untuk Android.
publish_to: none
version: 0.7.2+11
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  feather_icons: ^1.2.1
  flutter_svg: ^2.5.0
  drift: ^2.35.4
  path: ^1.9.1
  path_provider: ^2.1.6
  file_picker: ^13.4.0
  cryptography: ^2.9.0
  uuid: ^4.6.0
  http: ^1.6.0
  archive: ^4.7.1
  xml: ^7.0.1
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/ui/icons/
    - assets/ui/providers/
    - assets/ui/licenses/
    - assets/data/idx_stocks.json
    - assets/data/crypto_defaults.json
    - assets/data/history/
    - assets/data/ihsg.json.Z
    - assets/data/ihsg_meta.json
  fonts:
    - family: BitSans
      fonts:
        - asset: assets/fonts/bit_sans_regular.otf
        - asset: assets/fonts/bit_sans_bold.otf
          weight: 700
    - family: Lato
      fonts:
        - asset: assets/Lato-Regular.ttf
        - asset: assets/Lato-Bold.ttf
          weight: 700
